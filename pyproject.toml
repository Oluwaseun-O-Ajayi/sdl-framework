[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sdl-framework"
version = "1.1.0"
description = "Closed-loop experimental optimization with Gaussian-process Bayesian optimization, following self-driving laboratory principles"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oluwaseun O. Ajayi", email = "oluwaseun.ajayi@uga.edu" }]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "pandas>=1.3",
  "scikit-learn>=1.0",
  "matplotlib>=3.4",
  "seaborn>=0.11",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Oluwaseun-O-Ajayi/sdl-framework"
Issues = "https://github.com/Oluwaseun-O-Ajayi/sdl-framework/issues"

[tool.setuptools.packages.find]
include = ["sdl_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
